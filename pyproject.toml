[project]
name = "html-mastery"
version = "0.1.0"
description = "An opinionated canon + toolkit for self-contained, dark-first HTML artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan Cetlin" }]
keywords = ["html", "static-site", "generator", "d3", "dark-mode", "self-contained"]
dependencies = [
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Markdown rendering of section content in the renderer is optional.
markdown = ["markdown>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["htmlgen"]
